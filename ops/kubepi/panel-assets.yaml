# ---------------------------------------------------------------------------
# 与既有文档冲突的一条事实（须由人来处置，本清单只记录不改判）
# ---------------------------------------------------------------------------
deviations:
  - id: "DEV-1"
    found_at: "2026-11-06"
    fact: |
      集群 110（面板探测到 v1.22.2）已被导入面板且 status_phase=Completed（连接成功）。
      而《集群管控集成方案》§2.2 非目标与 §8.2 版本兼容矩阵都写明：110 不纳入面板，
      理由是指定版本的面板官方最低支持 Kubernetes v1.24，v1.23 及更早明确不在支持范围。
    impact: |
      文档与实况不一致：要么决策已实际变更（则应把 110 的支持性结论与风险重新记一档），
      要么这是一次越出既定范围的导入（则应撤下 110）。二者都必须由人选择，不能默认。
      注意"连接成功"不等于"功能可用"：官方支持区间之外的 API 差异可能表现为个别页面报错，
      这类报错将来会被当成面板 bug 去排查，浪费一轮。
    action_needed: "由运维在'撤下 110'与'承认 110 已纳管并改写文档'之间择一，登记进台账 T4"

# ---------------------------------------------------------------------------
# 清单机制的两条已知限制（不是数据问题，是读法问题；改脚本前务必读这两条）
# ---------------------------------------------------------------------------
method_caveats:
  - |
    检索模式必须用 KubePi 自有的 JSON 紧凑风格（"kind":"Cluster"、"apiServer"、"mode"）。
    若误用 kubeconfig/YAML 风格（kind: Config、server: https://、client-certificate-data），
    会稳定得到 0 命中，把"有 2 个集群"报成"一个都没导入"。2026-11-06 实测连错两轮。
  - |
    去重必须按 uuid，不能按整行 sort -u。bbolt 会同时保留同一条记录的新旧两个版本
    （updateAt 不同、旧页未回收），整行去重会把 2 个集群报成 3 个。
  - |
    每日 02:40 的快照对"当天新增内容"有最长约 21 小时空窗。要拿实时清单须先手动跑一次
    backup-kubepi.sh（会短暂停容器约 2 秒，属变更操作，需先告知），见台账 M1-4b。
