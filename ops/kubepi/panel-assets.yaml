    residual_risk: |
      “连接成功”不等于“功能可用”。超出官方支持区间的 API 差异会表现为个别页面报错或
      数据不全；快速判定方法：先对比同一操作在 121（v1.36.5，官方推荐区间内）上是否正常。
      收口条件：110 升级至 ≥ v1.24，或退役并从面板删除。

# ---------------------------------------------------------------------------
# 清单机制的两条已知限制（不是数据问题，是读法问题；改脚本前务必读这两条）
# ---------------------------------------------------------------------------
method_caveats:
  - |
    检索模式必须用 KubePi 自有的 JSON 紧凑风格（"kind":"Cluster"、"apiServer"、"mode"）。
    若误用 kubeconfig/YAML 风格（kind: Config、server: https://、client-certificate-data），
    会稳定得到 0 命中，把"有 2 个集群"报成"一个都没导入"。2026-11-06 实测连错两轮。
  - |
    去重必须按 uuid，不能按整行 sort -u。bbolt 会同时保留同一条记录的新旧两个版本
    （updateAt 不同、旧页未回收），整行去重会把 2 个集群报成 3 个。
  - |
    自动快照已降为**每周日 02:40**（2026-11-09 决定，cron `40 2 * * 0`）。“当天新增内容”的空窗因此变长到最多约 7 天。
    要拿实时清单需先手动跑一次 backup-kubepi.sh（会短暂停容器约 2 秒，属变更操作，需先告知）；升级/重要变更前也适用同一手动补射，见台账 M1-4b。
  - |
    **静态导出跨体系误读**：面板 bbolt 内同时存放面板自己账号与外部服务登录信息的相关字段，仅靠关键字检索很易把 docker ACR 登录用户名
    误认为面板账号。2026-11-06 首次导出将 `lloyd9527`（实为 ACR 登录名）当面板账号；2026-11-09 浏览器实测发现与 clusters.created_by=`admin` 自相矛盾，已就地订正。
    **固定做法**：任何面板账号信息以面板 HTTP 实登录为权威；静态解包只能当参考，发现与 clusters.created_by 不一致时一律以 `admin` 实测为准。
